[workspace]

[package]
name = "plexus-login"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Login for a Plexus RPC service — our own sign-in page over a swappable identity backend (WorkOS, plexus-idp, memory), provider specs (OIDC, WorkOS, Auth0, plexus-idp, nostr, agent keys), the login page and its routes, sessions, the WebSocket gate and the auth backend — generic over the app's access rules"
repository = "https://github.com/hypermemetic-ai/plexus-login"
readme = "README.md"
keywords = ["plexus", "login", "oidc", "workos", "auth"]
categories = ["authentication", "web-programming::http-server"]
# SCAFFOLD-3 (S1): begun inside menger (owner, 2026-10-11).
# SCAFFOLD-9 (B5): named for whichever app takes it, wired in two calls,
# published. FRAME-4: a repository and workspace of its own beside
# plexus-core. The seam to the app is one trait, `LoginAccess`
# (src/access.rs); menger, for one, implements it over its `Access`;
# `simple::SimpleAccess` is the ready-made one.
#
# What the package carries: the sources and the page (src/web_login.rs
# include_str!s web/login.html). The tests and the example stay in the
# repository.
include = ["/src/**", "/web/login.html", "/README.md", "/LICENSE"]

[dependencies]
# The plexus 0.11 line (KEEL-45; 0.10 before it, NEST-13; 0.8, PLEXUS-16, V2-58), through the
# umbrella (PLEXUS-44): plexus-core, plexus-auth-core with its identity
# adapters, and plexus-transport — SCAFFOLD-9: `Wired::apply` puts the gate,
# the anonymous view and the protected resource on a TransportServerBuilder.
# Slim: no MCP, no REST.
plexus-rpc = { version = "0.11.0", features = ["auth-adapters"] }
# KEEL-45: the floor of the fixed line. plexus-rpc 0.11.0 asks only ^0.11.0 /
# ^0.10 / ^0.3.1, which a lockfile may hold below the security releases of
# 2026-11-10 (KEEL-19, KEEL-29, KEEL-31..33); these lines require them. The
# code names them through the umbrella.
plexus-core = { version = "0.11.1", default-features = false }
plexus-transport = { version = "0.10.1", default-features = false }
plexus-auth-core = "0.3.2"
plexus-macros = "0.11.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
# The dev sign-in registers accounts at plexus-idp over its Plexus socket.
jsonrpsee = { version = "0.26", features = ["ws-client"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
# AUTH-22: TOTP's HMAC-SHA1 (RFC 6238). (The trusted proxies' CIDRs are
# plexus-transport's since KEEL-45.)
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
jsonrpsee = { version = "0.26", features = ["ws-client", "server"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# tests/simple_login.rs: a fixture OIDC issuer mints the tokens plexus-idp
# would (menger's tests/login_page.rs does the same).
jsonwebtoken = "9"
# RUN-9: the shell's metadata route, called as a service.
tower = { version = "0.5", features = ["util"] }
